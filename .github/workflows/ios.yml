name: iOS build
# Builds an UNSIGNED .ipa for sideloading (AltStore / Sideloadly re-sign it with your Apple ID).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: attach the .ipa to this existing release (e.g. v1.0.2). Leave empty to only keep it as a build artifact."
        required: false
        default: ""
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
permissions:
  contents: write
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen ldid
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned, device)
        working-directory: ios
        run: |
          xcodebuild -project CursorAI.xcodeproj -scheme CursorAI -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Embed entitlements and package the .ipa
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/CursorAI.app
          ldid -SBroadcastExtension/BroadcastExtension.entitlements "$APP/PlugIns/BroadcastExtension.appex/BroadcastExtension"
          ldid -SCursorAI/CursorAI.entitlements "$APP/CursorAI"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry CursorAI-iOS.ipa Payload
          ls -l CursorAI-iOS.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CursorAI-iOS-ipa
          path: ios/CursorAI-iOS.ipa
      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" ios/CursorAI-iOS.ipa --clobber --repo "$GITHUB_REPOSITORY"
