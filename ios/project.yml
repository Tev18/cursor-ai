name: CursorAI
options:
  bundleIdPrefix: com.yousef
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CursorAI:
    type: application
    platform: iOS
    sources:
      - CursorAI
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yousef.cursorai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: CursorAI/Info.plist
      properties:
        CFBundleDisplayName: Cursor AI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsMultipleScenes: true
        UIRequiresFullScreen: false
    entitlements:
      path: CursorAI/CursorAI.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yousef.cursorai]
    dependencies:
      - target: BroadcastExtension
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - BroadcastExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yousef.cursorai.broadcast
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: Cursor AI Broadcast
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: BroadcastExtension/BroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yousef.cursorai]
schemes:
  CursorAI:
    build:
      targets:
        CursorAI: all
